services:
  postgres:
    image: postgres:18
    container_name: asistencia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: asistencia_api
    ports:
      - "5436:5432"
    volumes:
      - asistencia_data:/var/lib/postgresql

volumes:
  asistencia_data: